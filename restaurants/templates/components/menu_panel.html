{% load i18n %}
<div id="menu-panel">
    {% if meal_tabs %}
    <nav>
        <div class="meal-tab-bar">
            {% for tab in meal_tabs %}
            <button type="button"
                id="tab-{{ tab.id }}"
                hx-get="{% url 'menu_list' bases path %}?meal={{ tab.id }}&day={{ selected_day }}&previous={{ previous }}"
                hx-target="#menu-view"
                hx-select="#menu-view"
                hx-swap="outerHTML"
                hx-push-url="true"
                class="tab {% if selected_meal == tab.id %}tab--active{% endif %}">
                {% trans tab.label %}
                <span class="tab-subtitle">{% trans tab.meal_time %}</span>
            </button>
            {% endfor %}
        </div>
    </nav>
    {% endif %}

    {% include 'components/menu_items.html' %}
</div>
