{% load i18n %}
<div class="week-nav" id="week-nav">
    <button type="button"
        hx-get="{% url 'menu_list' bases path %}?day={{ selected_day }}&meal={{ selected_meal }}&previous={{ previous|add:1 }}"
        hx-target="#menu-view"
        hx-select="#menu-view"
        hx-swap="outerHTML"
        hx-push-url="true"
        class="week-nav-link" aria-label="Previous week">
        <i data-lucide="chevron-left" class="week-nav-icon"></i>
    </button>
    <span class="week-nav-label">{{week|slice:"0:1"|first|slice:"0:4"}}.{{week|slice:"0:1"|first|slice:"4:6"}}.{{week|slice:"0:1"|first|slice:"6:8"}}~{{week|slice:"4:5"|first|slice:"0:4"}}.{{week|slice:"4:5"|first|slice:"4:6"}}.{{week|slice:"4:5"|first|slice:"6:8"}}</span>
    {% if previous %}
    <button type="button"
        hx-get="{% url 'menu_list' bases path %}?day={{ selected_day }}&meal={{ selected_meal }}&previous={{ previous|add:'-1' }}"
        hx-target="#menu-view"
        hx-select="#menu-view"
        hx-swap="outerHTML"
        hx-push-url="true"
        class="week-nav-link" aria-label="Next week">
        <i data-lucide="chevron-right" class="week-nav-icon"></i>
    </button>
    {% endif %}
</div>
