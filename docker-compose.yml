services:
  web:
    build: .
    container_name: food
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Seoul
      - DJANGO_DEBUG=False
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # One-off weekly scrape: runs scrape_weekly.sh and exits (no restart, no
  # resident process). Trigger from host cron instead of the old scheduler:
  #   05 23 * * 5  cd /home/ubuntu/food && docker compose run --rm --no-deps scraper
  scraper:
    build: .
    command: bash /app/scrape_weekly.sh
    environment:
      - APP_DIR=/app
      - PYTHON=python
      - TZ=Asia/Seoul
      - DJANGO_DEBUG=False
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
